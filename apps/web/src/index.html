<!doctype html>
<html lang="sq">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VetCoreOS</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="hero">
        <div>
          <p class="eyebrow">P1 Clinic Core MVP</p>
          <h1>VetCoreOS</h1>
          <p class="lead">Bërthama klinike po nis me pronarë, pacientë dhe vizita të gjurmueshme ndaj `F001-F045`.</p>
        </div>
        <div class="metrics" id="metrics"></div>
      </section>

      <section>
        <div class="section-title">
          <p>Clinic core</p>
          <h2>Pacientet, pronaret dhe vizitat</h2>
        </div>
        <div class="grid three" id="clinic-summary"></div>
        <div class="grid two stacked" id="clinic-records"></div>
      </section>

      <section>
        <div class="section-title">
          <p>Roadmap</p>
          <h2>Fazat e ndertimit</h2>
        </div>
        <div class="grid two" id="phases"></div>
      </section>

      <section>
        <div class="section-title">
          <p>Blueprint</p>
          <h2>Domaine produkti</h2>
        </div>
        <div class="grid three" id="domains"></div>
      </section>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
